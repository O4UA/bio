<!doctype html>
<html lang="id">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: {
            glass: 'rgba(255, 255, 255, 0.02)',
            'glass-border': 'rgba(255, 255, 255, 0.12)',
          }
        }
      }
    }

  <style>
    :root {
      --accent: #268bd2;
      --bg-start: #002b36;
      --bg-end: #073642;
      --glow: rgba(38, 139, 210, 0.3);
      --grad-start: #268bd2;
      --grad-end: #2aa198;
    }

    body[data-theme="solarized"] { 
      --accent: #268bd2; --bg-start: #001b22; --bg-end: #073642; --glow: rgba(38, 139, 210, 0.3);
      --grad-start: #268bd2; --grad-end: #2aa198;
    }
    body[data-theme="emerald"] { 
      --accent: #2aa198; --bg-start: #02201a; --bg-end: #064e3b; --glow: rgba(42, 161, 152, 0.3);
      --grad-start: #2aa198; --grad-end: #859900;
    }
    body[data-theme="purple"] { 
      --accent: #a855f7; --bg-start: #0f071b; --bg-end: #1e0b36; --glow: rgba(168, 85, 247, 0.25);
      --grad-start: #a855f7; --grad-end: #6366f1;
    }

    body {
      background: radial-gradient(circle at top right, var(--bg-end), var(--bg-start));
      min-height: 100vh;
      transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      overflow-x: hidden;
    }

    .ambient-bg {
      position: fixed;
      width: 150vw;
      height: 150vh;
      background: radial-gradient(circle at center, var(--glow) 0%, transparent 70%);
      z-index: -1;
      filter: blur(100px);
      animation: pulseBg 12s infinite alternate;
    }

    @keyframes pulseBg {
      0% { transform: translate(-15%, -15%) scale(1); }
      100% { transform: translate(10%, 10%) scale(1.15); }
    }

    .glass-main {
      background: rgba(255, 255, 255, 0.035);
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
      border: 1px solid var(--glass-border);
      border-radius: 60px;
      box-shadow: 0 40px 120px -20px rgba(0, 0, 0, 0.7);
      position: relative;
    }

    .audio-panel {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 40px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.05);
    }

    /* Kick Visualizer Style */
    #kick-fill {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 0%;
      background: linear-gradient(to right, var(--accent), transparent);
      opacity: 0.15;
      pointer-events: none;
      z-index: 1;
      transition: width 0.05s ease-out;
    }

    .tab-panel {
      display: none;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .tab-panel.active { 
      display: block; 
      opacity: 1; 
      transform: translateY(0);
    }

    .nav-btn {
      position: relative;
      transition: all 0.3s ease;
      color: rgba(255, 255, 255, 0.3);
    }
    .nav-btn.active {
      color: white;
      transform: translateY(-2px);
    }
    .nav-indicator {
      position: absolute;
      bottom: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 4px;
      background: var(--accent);
      border-radius: 20px;
      box-shadow: 0 0 15px var(--accent);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .nav-btn.active .nav-indicator { width: 32px; }

    .link-card {
      background: linear-gradient(110deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 32px;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .link-card:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: scale(1.03) translateY(-6px);
      border-color: rgba(255, 255, 255, 0.2);
    }

    #lightbox {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(30px); z-index: 1000;
      display: none; cursor: zoom-out;
    }

    .greeting-text {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: var(--accent);
      margin-bottom: 4px;
      opacity: 0.8;
    }
    
    #typing-text::after {
  content: '|';
  animation: blink 0.8s infinite;
  color: var(--accent);
  margin-left: 4px;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

    const riddles = [
      { q: "Jika hari ini hari Rabu, 100 hari lagi jatuh pada hari apa?", a: "Jumat, karena 100 dibagi 7 sisanya 2. (Rabu + 2 hari = Jumat )" },
      { q: "Sebuah mobil melaju 60 km/jam selama 1 jam. Lalu 60 km/jam lagi selama 1 jam berikutnya. Berapa kecepatan rata-ratanya?", a: "60 km/jam. Karena kecepatannya konsisten." },
      { q: "Sebuah jam menunjukkan pukul 03.15. Sudut antara jarum jam dan menit berapa derajat?", a: "7,5°.Jarum menit di 90°. Jarum jam sudah bergerak 3 × 30° + 15 × 0,5° = 97,5°. Selisihnya 7,5°." },
      { q: "Jika semua A adalah B, dan semua B adalah C, apakah semua A adalah C?", a: "Ya. Karena A ⊂ B dan B ⊂ C." },

      { q: "Kata apa dalam bahasa Indonesia yang selalu dibaca sama dari depan dan belakang?", a: "Kasur Rusak" }
    ];

    const audio = document.getElementById('audio');
    const audioContainer = document.getElementById('audio-container');
    const playBtn = document.getElementById('play-btn');
    const pauseBtn = document.getElementById('pause-btn');
    const progBar = document.getElementById('prog-bar');

    let seconds = 0;

    function updateGreeting() {
      const hour = new Date().getHours();
      let msg = "";
      if (hour >= 5 && hour < 12) msg = "Selamat Pagi";
      else if (hour >= 12 && hour < 15) msg = "Selamat Siang";
      else if (hour >= 15 && hour < 18) msg = "Selamat Sore";
      else msg = "Selamat Malam";
      document.getElementById('greeting').innerText = msg;
    }

    function generateRiddle() {
  const container = document.getElementById('riddle-container');
  const random = riddles[Math.floor(Math.random() * riddles.length)];
  
  // Reset container dengan struktur dasar
  container.innerHTML = `
    <div class="w-full">
      <p id="typing-text" class="text-[15px] text-white/80 font-medium italic mb-8 min-h-[60px] leading-relaxed"></p>
      <div id="riddle-actions" class="flex items-center gap-6 opacity-0 transition-opacity duration-500">
         <button onclick="revealAnswer(this)" class="px-6 py-2.5 rounded-2xl bg-[var(--accent)] text-white text-[10px] font-black uppercase tracking-widest shadow-xl shadow-[var(--glow)] transition hover:brightness-110 active:scale-90">Buka Rahasia</button>
         <p class="answer hidden text-[13px] font-bold text-white/50 tracking-wide">${random.a}</p>
      </div>
    </div>
  `;

  // Logika Typing Animation
  const textElement = document.getElementById('typing-text');
  const actions = document.getElementById('riddle-actions');
  const fullText = `"${random.q}"`;
  let index = 0;

  function type() {
    if (index < fullText.length) {
      textElement.innerHTML += fullText.charAt(index);
      index++;
      setTimeout(type, 40); // Kecepatan mengetik (40ms per karakter)
    } else {
      // Munculkan tombol setelah mengetik selesai
      actions.classList.remove('opacity-0');
    }
  }

  type();
}


    function revealAnswer(btn) {
      btn.style.display = 'none';
      btn.nextElementSibling.classList.remove('hidden');
    }

    async function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        const source = audioCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        // Meningkatkan resolusi untuk filter frekuensi lebih tajam
        analyser.fftSize = 1024;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        renderVisuals();
      }
      if (audioCtx.state === 'suspended') await audioCtx.resume();
    }

    function renderVisuals() {
      requestAnimationFrame(renderVisuals);
      if (!analyser || audio.paused) {
        kickFill.style.width = '0%';
        return;
      }

      analyser.getByteFrequencyData(dataArray);
      
      // Sangat spesifik pada frekuensi Kick (sub-bass)
      // Index 1-3 pada fftSize 1024 sekitar 40Hz - 120Hz
      let kickValue = (dataArray[1] + dataArray[2] + dataArray[3]) / 3;

      // Threshold lebih tinggi untuk membuang suara selain kick
      const threshold = 160; 
      if(kickValue > threshold) {
        const intensity = (kickValue - threshold) / (255 - threshold);
        // Melebar ke kanan hingga penuh (100%)
        kickFill.style.width = (intensity * 100) + '%';
        kickFill.style.opacity = 0.1 + (intensity * 0.3);
      } else {
        // Kembali ke 0 dengan cepat
        kickFill.style.width = '0%';
        kickFill.style.opacity = '0.05';
      }
    }

    function toggleAudio() {
      initAudio().then(() => {
        if (audio.paused) {
          audio.play();
          playBtn.classList.add('hidden');
          pauseBtn.classList.remove('hidden');
          audioContainer.classList.add('playing');
        } else {
          audio.pause();
          playBtn.classList.remove('hidden');
          pauseBtn.classList.add('hidden');
          audioContainer.classList.remove('playing');
        }
      });
    }

    function loadCustomAudio(input) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        const url = URL.createObjectURL(file);
        audio.src = url;
        trackName.innerText = file.name.split('.')[0];
        audio.play();
        playBtn.classList.add('hidden');
        pauseBtn.classList.remove('hidden');
        audioContainer.classList.add('playing');
        
        // Memudarkan tombol load setelah berhasil (opacity sangat rendah)
        loadLabel.style.opacity = "0.05";
        
        initAudio();
      }
    }

    function formatTime(s) {
      const min = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${min}:${sec.toString().padStart(2, '0')}`;
    }

    audio.ontimeupdate = () => {
      const pct = (audio.currentTime / audio.duration * 100);
      progBar.style.width = pct + '%';
      timer.innerText = formatTime(audio.currentTime);
    };

    function seek(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const x = e.clientX - rect.left;
      audio.currentTime = (x / rect.width) * audio.duration;
    }

    function tab(id) {
      document.querySelectorAll('.tab-panel').forEach(p => { p.classList.remove('active'); p.style.display = 'none'; });
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      const targetPanel = document.getElementById('tab-'+id);
      const targetBtn = document.getElementById('btn-'+id);
      targetPanel.style.display = 'block';
      setTimeout(() => targetPanel.classList.add('active'), 10);
      targetBtn.classList.add('active');
    }

    function setTheme(t) { document.body.setAttribute('data-theme', t); }

    function openLB(src) {
      const lb = document.getElementById('lightbox');
      document.getElementById('lb-img').src = src;
      lb.style.display = 'flex';
    }

    window.onload = () => {
      updateGreeting();
      generateRiddle();
      setInterval(() => {
        seconds++;
        document.getElementById('real-time-status').innerText = seconds < 60 ? "ONLINE" : `${Math.floor(seconds/60)}m`;
      }, 1000);
    };
  </script>
</body>
